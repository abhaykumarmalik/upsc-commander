
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPSC COMMANDER | Admin</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 25px;
      background: #0b1120;
      color: #e5e7eb;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 { color: #60a5fa; }

    .panel {
      background: #172033;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
    }

    button {
      background: #2563eb;
      color: white;
      border: 0;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    #status { color: #fbbf24; }
    .user-item {
      padding: 10px;
      margin-top: 8px;
      background: #26334a;
      border-radius: 6px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>UPSC COMMANDER</h1>
    <p>Administrator Dashboard</p>

    <div class="panel">
      <h2>Admin Access</h2>
      <p id="status">Checking account...</p>
      <button id="logout">Logout</button>
    </div>

    <div class="panel">
      <h2>User Management</h2>
      <p>Total Registered Users:
  <strong id="totalUsers">0</strong>
</p>

<div style="overflow-x:auto;">
  <table style="width:100%; border-collapse:collapse; color:white;">
    <thead>
      <tr>
        <th>User ID</th>
        <th>Email</th>
        <th>Registration Date</th>
        <th>Last Login</th>
      </tr>
    </thead>
    <tbody id="usersList">
      <tr>
        <td colspan="4">Loading users...</td>
      </tr>
    </tbody>
  </table>
</div>

  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDocFromServer,
      collection,
      getDocs
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    // Apne Firebase Project ki existing values yahan rakho.
    const firebaseConfig = {
      apiKey: "AIzaSyBYf0Xh3RSLlxOEDoEEnyTPvw6ZYf9RreI",
      authDomain: "upsc-commander.firebaseapp.com",
      projectId: "upsc-commander",
      storageBucket: "upsc-commander.firebasestorage.app",
      messagingSenderId: "621957377517",
      appId: "1:621957377517:web:57060b9a2d26a7a7d48be4"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const status = document.getElementById("status");
    const usersList = document.getElementById("usersList");
    const totalUsers = document.getElementById("totalUsers");


    onAuthStateChanged(auth, async (user) => {
console.log("Admin Auth User:", user);
      if (!user) {
        status.textContent = "Please login first.";
        usersList.textContent = "Login required.";
        return;
      }

      try {

        // Verify Admin
        const adminDoc = await getDocFromServer(
          doc(db, "admin", user.uid)
        );

        if (
          !adminDoc.exists() ||
          adminDoc.data().role !== "admin"
        ) {
          status.textContent = "Access denied: Not an admin.";
          usersList.textContent = "Admin access required.";
          return;
        }

        status.textContent = "Admin verified successfully.";

        
        // Load Registered Users
        usersList.innerHTML = `
          <tr>
            <td colspan="4">Loading users...</td>
          </tr>
        `;

        const usersSnapshot = await getDocs(
          collection(db, "users")
        );

        totalUsers.textContent = usersSnapshot.size;
        usersList.innerHTML = "";

        if (usersSnapshot.empty) {
          usersList.innerHTML = `
            <tr>
              <td colspan="4">No registered users found.</td>
            </tr>
          `;
        } else {
          usersSnapshot.forEach((userDoc) => {
            const data = userDoc.data();

            const row = document.createElement("tr");

            const userIdCell = document.createElement("td");
            userIdCell.textContent = userDoc.id;

            const emailCell = document.createElement("td");
            emailCell.textContent = data.email || "Not available";

            const createdCell = document.createElement("td");
            createdCell.textContent = data.createdAt
              ? new Date(data.createdAt).toLocaleString("en-IN")
              : "Not available";

            const loginCell = document.createElement("td");
            loginCell.textContent = data.lastLogin
              ? new Date(data.lastLogin).toLocaleString("en-IN")
              : "Not available";

            row.append(
              userIdCell,
              emailCell,
              createdCell,
              loginCell
            );

            usersList.appendChild(row);
          });
        }

        console.log("Admin verified:", user.uid);
        console.log("Total users:", usersSnapshot.size);


      } catch (error) {

        status.textContent = "Firebase Error: " + error.message;
        usersList.textContent = "Unable to load users.";

        console.error("Admin Dashboard Error:", error);

      }

    });


    // Logout
    document.getElementById("logout").onclick = async () => {

      try {
        await signOut(auth);
        status.textContent = "Logged out successfully.";
        usersList.textContent = "Logged out.";

      } catch (error) {
        status.textContent = "Logout Error: " + error.message;
      }

    };

  </script>
</body>
</html>
